name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sandbox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap + Chrome
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          wget -q -O chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./chrome.deb
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: "Baseline: Chrome raster outside the sandbox"
        timeout-minutes: 3
        run: python tools/sandbox_selftest.py --baseline
      - name: "Sandbox self-test (bwrap + Chrome raster)"
        timeout-minutes: 6
        run: WL_BENCH_SELFTEST_REQUIRE=1 python tools/sandbox_selftest.py

  sandbox-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Baseline: Chrome raster outside the sandbox"
        timeout-minutes: 3
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          python tools/sandbox_selftest.py --baseline
      - name: "Sandbox self-test (seatbelt + Chrome raster)"
        timeout-minutes: 6
        run: WL_BENCH_SELFTEST_REQUIRE=1 python tools/sandbox_selftest.py
