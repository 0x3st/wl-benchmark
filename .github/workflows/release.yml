name: Release

# On a version tag (v1.2.3):
#   1. sync the version into pyproject.toml, build sdist + wheel
#   2. publish to PyPI via Trusted Publishing (OIDC — no API token)
#   3. create the GitHub Release
#   4. render the Homebrew formula and push it to 0x3st/homebrew-tap
#      (skipped unless the HOMEBREW_TAP_TOKEN secret is configured)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing
      contents: write   # release creation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version = $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --title "wl-benchmark $GITHUB_REF_NAME" \
            --generate-notes

  homebrew:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap update"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # use the release sdist (built with the synced version), not the
          # auto-generated tag tarball whose pyproject still has the old version
          URL="https://github.com/0x3st/wl-benchmark/releases/download/${GITHUB_REF_NAME}/wl_benchmark-${VERSION}.tar.gz"
          SHA256="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"

          FORMULA=$(cat <<RUBY
          require "language/python"

          class Wlb < Formula
            include Language::Python::Virtualenv
            desc "Agentic AI benchmark of CUHK-Shenzhen (essay / SVG / quant / scheduling)"
            homepage "https://github.com/0x3st/wl-benchmark"
            url "${URL}"
            sha256 "${SHA256}"
            license "MIT"
            version "${VERSION}"

            depends_on "python@3.12"

            def install
              # stdlib-only package: a bare venv install has no resources
              venv = virtualenv_create(libexec, "python3.12")
              venv.pip_install_and_link buildpath
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/wlb --version")
            end
          end
          RUBY
          )

          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/0x3st/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          echo "$FORMULA" > Formula/wlb.rb
          git config user.name "wl-benchmark-release-bot"
          git config user.email "noreply@github.com"
          git add Formula/wlb.rb
          git commit -m "wlb ${VERSION}" --allow-empty
          git push origin HEAD
          echo "::notice::tap updated — brew install 0x3st/tap/wlb"
